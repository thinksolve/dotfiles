[mgr]
ratio = [1, 3, 4]
show_symlink = true
show_hidden = true

[preview]
wrap = "yes"

[opener]
video = [
  { run = 'open -a IINA.app "$1"', desc = "Open with IINA" },
  { run = 'open -a VLC.app "$1"', desc = "Open with VLC" },
  { run = 'open -a "QuickTime Player" "$1"', desc = "Open with QuickTime Player" }
]
marktext = [
  { run = 'open -a "MarkText" "$1"', desc = "Open with MarkText" },
]


[open]
prepend_rules = [
  { mime = "video/*", use = [ "open", "video" ] },
  { url = "*.md", use = [ "open", "edit", "marktext" ] },
]
